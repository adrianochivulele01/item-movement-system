<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Item Movement System</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <h1>Item Movement & Inventory System</h1>

    <!-- Dashboard Cards -->
    <div class="dashboard-grid">
      <div class="card">
        <h3>Total Items</h3>
        <p id="total-items-count">0</p>
      </div>
      <div class="card">
        <h3>Total Movements</h3>
        <p id="total-movements-count">0</p>
      </div>
    </div>

    <!-- Forms Section -->
    <div class="forms-container">
      <div class="card">
        <h2>Add New Item</h2>
        <form id="item-form">
          <label for="item-name">Item Name:</label>
          <input type="text" id="item-name" required placeholder="Enter item name..." />
          <button type="submit">Add Item</button>
        </form>
      </div>

      <div class="card">
        <h2>Record Movement</h2>
        <form id="movement-form">
          <label for="movement-item">Select Item:</label>
          <select id="movement-item" required>
            <option value="">-- Choose Item --</option>
          </select>

          <label for="movement-type">Movement Type:</label>
          <select id="movement-type" required>
            <option value="IN">IN</option>
            <option value="OUT">OUT</option>
          </select>

          <label for="movement-quantity">Quantity:</label>
          <input type="number" id="movement-quantity" min="1" value="1" required />

          <button type="submit">Save Movement</button>
        </form>
      </div>
    </div>

    <!-- Current Stock Table -->
    <div class="card">
      <h2>Current Stock Balance</h2>
      <table>
        <thead>
          <tr>
            <th>Item Name</th>
            <th>Current Stock</th>
          </tr>
        </thead>
        <tbody id="stock-tbody"></tbody>
      </table>
    </div>

    <!-- Recent Movements Table -->
    <div class="card">
      <h2>Recent Movements History</h2>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Item</th>
            <th>Type</th>
            <th>Quantity</th>
          </tr>
        </thead>
        <tbody id="movement-tbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // --- Supabase Config ---
    const SUPABASE_URL = "https://nxrgqzeoylialaiplfxp.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_07gbRce8AzguRzBqR4s11A_0P4spj3d"; 

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- Load Data Using RPC Functions ---
    async function refreshAll() {
      await Promise.all([loadStock(), loadMovements(), loadItemDropdown()]);
    }

    async function loadItemDropdown() {
      const { data: items, error } = await client.rpc('list_items');
      if (error) return console.error('Error loading items:', error);

      const dropdown = document.getElementById('movement-item');
      dropdown.innerHTML = '<option value="">-- Choose Item --</option>';
      (items || []).forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = item.name;
        dropdown.appendChild(opt);
      });
      document.getElementById('total-items-count').textContent = (items || []).length;
    }

    async function loadStock() {
      const { data: stock, error } = await client.rpc('get_stock');
      if (error) return console.error('Error loading stock:', error);

      const tbody = document.getElementById('stock-tbody');
      tbody.innerHTML = '';
      (stock || []).forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${row.name}</td><td><strong>${row.current_stock}</strong></td>`;
        tbody.appendChild(tr);
      });
    }

    async function loadMovements() {
      const { data: movements, error } = await client.rpc('list_movements');
      if (error) return console.error('Error loading movements:', error);

      const tbody = document.getElementById('movement-tbody');
      tbody.innerHTML = '';
      (movements || []).forEach(m => {
        const tr = document.createElement('tr');
        const formattedDate = new Date(m.movement_date).toLocaleString();
        tr.innerHTML = `
          <td>${formattedDate}</td>
          <td>${m.item_name}</td>
          <td><span class="badge ${m.movement_type.toLowerCase()}">${m.movement_type}</span></td>
          <td>${m.quantity}</td>
        `;
        tbody.appendChild(tr);
      });
      document.getElementById('total-movements-count').textContent = (movements || []).length;
    }

    // --- Form Submissions (RPC) ---
    document.getElementById('item-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('item-name').value.trim();
      if (!name) return;

      const { error } = await client.rpc('add_item', { p_name: name });
      if (error) {
        alert('Error adding item: ' + error.message);
      } else {
        document.getElementById('item-name').value = '';
        await refreshAll();
      }
    });

    document.getElementById('movement-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const itemId = parseInt(document.getElementById('movement-item').value);
      const type = document.getElementById('movement-type').value;
      const quantity = parseInt(document.getElementById('movement-quantity').value);

      if (!itemId || quantity <= 0) return;

      const { error } = await client.rpc('add_movement', {
        p_item_id: itemId,
        p_movement_type: type,
        p_quantity: quantity
      });

      if (error) {
        alert('Error recording movement: ' + error.message);
      } else {
        document.getElementById('movement-quantity').value = '1';
        await refreshAll();
      }
    });

    // Initial load
    refreshAll();
  </script>
</body>
</html>
