name: Keep Supabase alive

on:
  schedule:
    # Runs at 03:00 UTC every 3 days
    - cron: "0 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase RPC API
        run: |
          curl -s -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/list_items" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"